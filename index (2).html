<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مرکز اعلان سامانه‌ها</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F4C4C">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{--paper:#F3F5F4;--ink:#14262B;--mute:#5B6F73;--line:#D5DDDC;--teal:#0F4C4C;--amber:#E0A100;--card:#fff;--err:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;line-height:1.8;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{background:var(--teal);color:#F3F5F4;padding:22px 20px 18px}
header h1{margin:0;font-size:1.5rem;font-weight:800}
header p{margin:2px 0 0;opacity:.8;font-size:.9rem}
main{max-width:640px;margin:0 auto;padding:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px;margin-bottom:16px}
.panel h2{margin:0 0 8px;font-size:1.05rem}
label{display:block;font-size:.85rem;color:var(--mute);margin-top:8px}
input{width:100%;font:inherit;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}
input:focus,button:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
button{font:inherit;font-weight:600;background:var(--teal);color:#fff;border:0;border-radius:6px;padding:10px 18px;margin-top:12px;cursor:pointer}
button.ghost{background:transparent;color:var(--teal);border:1px solid var(--teal)}
button:disabled{opacity:.5;cursor:default}
.status{margin-top:10px;font-size:.9rem;color:var(--mute)}
.status.err{color:var(--err)}.status.ok{color:var(--teal)}
.bar{display:flex;justify-content:space-between;align-items:center}
.bar button{margin:0;padding:5px 12px;font-size:.85rem}
.item{border-inline-start:5px solid var(--sys,var(--teal));padding:8px 12px;margin-top:10px;background:#FAFBFB;border-radius:4px}
.item .meta{font-size:.78rem;color:var(--mute)}
.item .t{font-weight:600}
.item a{color:var(--teal);font-size:.85rem}
.empty{color:var(--mute);margin:10px 0 0}
.hidden{display:none}
.toast{position:fixed;inset-inline:16px;bottom:calc(16px + env(safe-area-inset-bottom));background:var(--ink);color:#fff;padding:12px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.25)}
</style>
</head>
<body>
<header><h1>مرکز اعلان سامانه‌ها</h1><p>اعلان همه‌ی سامانه‌ها در یک‌جا</p></header>
<main>
  <section class="panel" id="setup">
    <h2>فعال‌سازی اعلان</h2>
    <p id="iosHint" class="status hidden">در آیفون ابتدا از منوی اشتراک‌گذاری مرورگر، «Add to Home Screen» را بزنید و برنامه را از روی صفحه‌ی اصلی باز کنید.</p>
    <label for="name">نام و نام خانوادگی</label>
    <input id="name" autocomplete="name">
    <label for="role">نقش یا واحد (مثلاً: انبار، آزمایشگاه، ایمنی)</label>
    <input id="role">
    <button id="enable">فعال‌سازی اعلان در این دستگاه</button>
    <div id="status" class="status"></div>
  </section>

  <section class="panel">
    <div class="bar"><h2>صندوق اعلان‌ها</h2><button class="ghost" id="refresh">به‌روزرسانی</button></div>
    <div id="list"></div>
  </section>
</main>
<div id="toast" class="toast hidden"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getMessaging, getToken, onMessage } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-messaging.js";

// ⚠️ آدرس وب‌اپ Apps Script (بعد از Deploy) را اینجا بگذارید
const HUB_URL = "https://script.google.com/macros/s/AKfycbzggqA5iFJkA5bUKc_uPw0LCdFVDiZVKrYp_vRyU9mumT2R2RyS4F49IUom9E-SoAlKEw/exec";
const VAPID_KEY = "BIZ0-KrZ4Mfta1JQjCyaai2C8_tkSHVnKdWcQwV7VM5I7yqRr8aRlt89hfdAoT5a_0K1SkBawj8Uow9yMZHjBjo";
const firebaseConfig = {
  apiKey: "AIzaSyDBjqheH4lB9agmu5VGHCwOreXZL1BvUU0",
  authDomain: "mohammad-55d06.firebaseapp.com",
  projectId: "mohammad-55d06",
  storageBucket: "mohammad-55d06.firebasestorage.app",
  messagingSenderId: "192200886544",
  appId: "1:192200886544:web:8d02ebe03ba8d2e451fd95"
};

const $ = (id) => document.getElementById(id);
const store = {
  get: (k) => { try { return localStorage.getItem(k) || ''; } catch { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch {} }
};
const COLORS = ["#0F4C4C", "#B26A00", "#6B3FA0", "#1F5FA8", "#A33A5B", "#4C7A1E"];
const colorFor = (s) => { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) >>> 0; return COLORS[h % COLORS.length]; };

function setStatus(msg, cls = "") { const s = $("status"); s.textContent = msg; s.className = "status " + cls; }
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.remove("hidden"); setTimeout(() => t.classList.add("hidden"), 5000); }

$("name").value = store.get("name");
$("role").value = store.get("role");
const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
const standalone = matchMedia("(display-mode: standalone)").matches || navigator.standalone;
if (isIOS && !standalone) $("iosHint").classList.remove("hidden");

async function hub(payload) {
  const r = await fetch(HUB_URL, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) });
  return r.json();
}

async function loadList() {
  const token = store.get("token");
  const box = $("list");
  box.textContent = "";
  if (!token) { box.innerHTML = '<p class="empty">برای دیدن اعلان‌ها، اول اعلان را در این دستگاه فعال کنید.</p>'; return; }
  try {
    const res = await (await fetch(HUB_URL + "?action=list&token=" + encodeURIComponent(token))).json();
    if (!res.ok || !res.items.length) { box.innerHTML = '<p class="empty">هنوز اعلانی نیامده است.</p>'; return; }
    for (const n of res.items) {
      const el = document.createElement("div");
      el.className = "item";
      el.style.setProperty("--sys", colorFor(n.system || ""));
      const meta = document.createElement("div"); meta.className = "meta";
      meta.textContent = (n.system || "") + " | " + new Date(n.time).toLocaleString("fa-IR");
      const t = document.createElement("div"); t.className = "t"; t.textContent = n.title;
      const b = document.createElement("div"); b.textContent = n.body;
      el.append(meta, t, b);
      if (/^https:\/\//.test(n.url || "")) {
        const a = document.createElement("a"); a.href = n.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "باز کردن سامانه";
        el.append(a);
      }
      box.append(el);
    }
  } catch (e) { box.innerHTML = '<p class="empty">دریافت اعلان‌ها ممکن نشد. اتصال اینترنت را بررسی کنید.</p>'; }
}

async function enable() {
  const name = $("name").value.trim(), role = $("role").value.trim();
  if (!name) return setStatus("نام را وارد کنید.", "err");
  if (!HUB_URL.startsWith("https://")) return setStatus("آدرس Apps Script در فایل index.html تنظیم نشده است.", "err");
  if (!("serviceWorker" in navigator) || !("PushManager" in window)) return setStatus("این مرورگر از اعلان پشتیبانی نمی‌کند.", "err");
  $("enable").disabled = true;
  try {
    const perm = await Notification.requestPermission();
    if (perm !== "granted") throw new Error("اجازه‌ی اعلان داده نشد. آن را در تنظیمات مرورگر فعال کنید.");
    const reg = await navigator.serviceWorker.register("./sw.js");
    await navigator.serviceWorker.ready;
    const messaging = getMessaging(initializeApp(firebaseConfig));
    const token = await getToken(messaging, { vapidKey: VAPID_KEY, serviceWorkerRegistration: reg });
    if (!token) throw new Error("توکن دریافت نشد.");
    const res = await hub({ action: "register", token, name, role });
    if (!res.ok) throw new Error(res.error || "ثبت در سرور انجام نشد.");
    store.set("name", name); store.set("role", role); store.set("token", token);
    setStatus("اعلان در این دستگاه فعال شد.", "ok");
    onMessage(messaging, (p) => { const d = p.data || {}; toast((d.title || "") + " - " + (d.body || "")); loadList(); });
    loadList();
  } catch (e) { setStatus(e.message || "خطا در فعال‌سازی.", "err"); }
  $("enable").disabled = false;
}

$("enable").onclick = enable;
$("refresh").onclick = loadList;
if (store.get("token") && Notification.permission === "granted") {
  setStatus("اعلان در این دستگاه فعال است.", "ok");
  navigator.serviceWorker.register("./sw.js").then(() => {
    onMessage(getMessaging(initializeApp(firebaseConfig)), (p) => { const d = p.data || {}; toast((d.title || "") + " - " + (d.body || "")); loadList(); });
  });
}
loadList();
</script>
</body>
</html>
